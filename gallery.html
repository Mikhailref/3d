<!DOCTYPE html>
<html lang="ru" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея 3D-Моделей и Печати</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc;
            --text-muted: #94a3b8; --accent-orange: #f97316; --accent-blue: #38bdf8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        nav { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent-orange); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .logo span { color: var(--accent-blue); }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; }
        .nav-links a { color: var(--text-color); text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-orange); }
        .lang-btn { background-color: var(--border-color); color: var(--text-color); border: 1px solid var(--accent-blue); padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .lang-btn:hover { background-color: var(--accent-blue); color: var(--bg-color); }
        
        .page-header { max-width: 1100px; margin: 3rem auto 2rem; padding: 0 2rem; text-align: center; }
        .page-header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .page-header h1 span { color: var(--accent-blue); }
        .page-header p { color: var(--text-muted); font-size: 1.1rem; }
        
        .gallery-grid { max-width: 1100px; margin: 0 auto; padding: 0 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .gallery-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: transform 0.2s ease, border-color 0.2s ease; }
        .gallery-card:hover { transform: translateY(-5px); border-color: var(--accent-orange); }
        .gallery-image { width: 100%; height: 200px; background-color: #0f172a; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-color); font-size: 3.5rem; }
        .gallery-content { padding: 1.5rem; }
        .gallery-content h3 { color: var(--text-color); font-size: 1.2rem; margin-bottom: 0.5rem; }
        .gallery-content p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; }
        
        .tag-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .tag { background-color: rgba(249, 115, 22, 0.1); color: var(--accent-orange); font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid rgba(249, 115, 22, 0.3); }

        footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); text-align: center; padding: 2rem; margin-top: 4rem; color: var(--text-muted); font-size: 0.9rem; }
        @media (max-width: 768px) { nav { flex-direction: column; gap: 1rem; } .nav-links { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">🖨️ 3D-Printing <span>& FreeCAD</span></a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html" data-ru="Главная" data-en="Home">Главная</a></li>
                    <li><a href="printing.html" data-ru="3D-Печать" data-en="3D Printing">3D-Печать</a></li>
                    <li><a href="freecad.html" data-ru="FreeCAD" data-en="FreeCAD">FreeCAD</a></li>
                    <li><a href="materials.html" data-ru="Материалы" data-en="Materials">Материалы</a></li>
                    <li><a href="gallery.html" class="active" data-ru="Галерея" data-en="Gallery">Галерея</a></li>
                </ul>
                <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">EN</button>
            </div>
        </nav>
    </header>

    <div class="page-header">
        <h1 data-ru="Галерея &lt;span&gt;Проектов&lt;/span&gt;" data-en="Project &lt;span&gt;Gallery&lt;/span&gt;">Галерея <span>Проектов</span></h1>
        <p data-ru="Модели, спроектированные во FreeCAD и напечатанные на 3D-принтере." data-en="Models designed in FreeCAD and 3D printed.">Модели, спроектированные во FreeCAD и напечатанные на 3D-принтере.</p>
    </div>

    <!-- Сда будет динамически подгружаться список проектов из data.json -->
    <main class="gallery-grid" id="projectsContainer">
        <p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);" data-ru="Загрузка проектов..." data-en="Loading projects...">Загрузка проектов...</p>
    </main>

    <footer>
        <p data-ru="© 2026 3D-Печать & FreeCAD Моделирование." data-en="© 2026 3D Printing & FreeCAD Modeling.">© 2026 3D-Печать & FreeCAD Моделирование.</p>
    </footer>

    <script>
        let globalProjectsData = [];

        // Переключение языка
        function toggleLanguage() {
            const html = document.getElementById('html-root');
            const btn = document.getElementById('langToggle');
            const currentLang = html.getAttribute('lang');
            const newLang = currentLang === 'ru' ? 'en' : 'ru';
            
            html.setAttribute('lang', newLang);
            btn.textContent = newLang === 'ru' ? 'EN' : 'RU';
            localStorage.setItem('site-lang', newLang);

            // Переводим статические элементы
            document.querySelectorAll('[data-ru]').forEach(el => {
                el.innerHTML = el.getAttribute(`data-${newLang}`);
            });

            // Рендерим проекты из JSON под новый язык
            renderProjects(newLang);
        }

        // Отрисовка карточек проектов из массива JSON
        function renderProjects(lang) {
            const container = document.getElementById('projectsContainer');
            if (!globalProjectsData || globalProjectsData.length === 0) return;

            container.innerHTML = globalProjectsData.map(item => {
                const title = lang === 'en' ? item.title_en : item.title_ru;
                const desc = lang === 'en' ? item.desc_en : item.desc_ru;
                const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');

                return `
                    <div class="gallery-card">
                        <div class="gallery-image"><span>${item.icon || '🔩'}</span></div>
                        <div class="gallery-content">
                            <h3>${title}</h3>
                            <p>${desc}</p>
                            <div class="tag-list">${tagsHtml}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // При загрузке страницы читаем data.json
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('site-lang') || 'ru';
            
            if (savedLang === 'en') {
                document.getElementById('html-root').setAttribute('lang', 'en');
                document.getElementById('langToggle').textContent = 'RU';
                document.querySelectorAll('[data-ru]').forEach(el => {
                    el.innerHTML = el.getAttribute('data-en');
                });
            }

            // Запрос файла data.json
            fetch('data.json')
                .then(response => {
                    if (!response.ok) throw new Error("Сетевая ошибка при запросе data.json");
                    return response.json();
                })
                .then(data => {
                    globalProjectsData = data.projects || [];
                    renderProjects(savedLang);
                })
                .catch(error => {
                    console.error("Ошибка загрузки данных:", error);
                    document.getElementById('projectsContainer').innerHTML = `
                        <p style="text-align: center; grid-column: 1/-1; color: #ef4444;">
                            Не удалось загрузить данные из data.json. Проверьте наличие файла в репозитории.
                        </p>
                    `;
                });
        });
    </script>
</body>
</html>
